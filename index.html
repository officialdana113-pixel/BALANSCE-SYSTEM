ඔබ ලබාදුන් කේතයේ (Code) වෙනත් කිසිදු ලොජික් එකක් හෝ ව්‍යුහයක් වෙනස් නොකර, ඔබ ඉල්ලා සිටි වෙනස්කම් දෙක පමණක් ඇතුළත් කර සම්පූර්ණ කරන ලද නිවැරදි `<script type="module">` කොටස පහතින් දැක්වේ.

1. **Database Search Filter:** දැන් ඔබට `Name`, `From`, `To` වලට අමතරව ඕනෑම මුදලක් (LKR Amount - උදා: 3000) ටයිප් කර සෙවීමේදී ඊට අදාළ සියලුම රෙකෝඩයන් ස්වයංක්‍රීයව පෙන්නුම් කරයි.
2. **Balance Sheet Clickable Cards:** දැන් Balance Sheet එකෙහි ඇති ඕනෑම Account Card එකක් (Title සහ Balance එක මත) ක්ලික් කළ විට, "Mulu Naya" ආකාරයෙන්ම ඒ හා සම්බන්ධ සියලුම ගනුදෙනු විස්තර (Date, Time, Name, Amount, Action) වෙනම Modal විස්තර කොටුවකින් බලාගත හැක.

පහත කේතය (Code) සම්පූර්ණයෙන්ම පිටපත් කර ඔබේ ගොනුවේ අවසාන `<script type="module">` එකට ආදේශ (Replace) කරගන්න:

```html
    <!-- Firebase SDK Modules Integration Links -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCAt-y8Xls79cOYP9Hdaq81WVkmk7bLA4U",
            authDomain: "dana1234567.firebaseapp.com",
            databaseURL: "https://dana1234567-default-rtdb.firebaseio.com",
            projectId: "dana1234567",
            storageBucket: "dana1234567.firebasestorage.app",
            messagingSenderId: "340938233900",
            appId: "1:340938233900:web:990da8040f099b1fc81989",
            measurementId: "G-ZDCQ2Q9EF6"
        };

        // Initialize Firebase Realtime Instance
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // System Core Data State Arrays
        let records = [];
        let manualBalances = {};
        let checkpointBalance = 0;
        let currentMode = 'deposit'; 
        let editIndex = null;
        let currentOpenStatusType = null; 

        // Predefined Target Categorization Mapping Indexes
        const bankAccounts = ["sampath bank", "peoples bank", "lolc bank", "lb bank", "ez cash", "dialog bank"];
        const bettingAccounts = ["1xbet", "888", "db bet", "melbet", "web", "1xbet web"];
        const fixedAccounts = [...bankAccounts, ...bettingAccounts, "mulu naya"];

        // --- Realtime Firebase Database Listeners ---
        onValue(ref(db, 'biz_records'), (snapshot) => {
            records = snapshot.val() || [];
            renderDatabase();
            if(document.getElementById('database-view').classList.contains('active-view')) {
                filterDatabaseBySearch();
            }
            renderBalances();
        });

        onValue(ref(db, 'biz_manual_bal'), (snapshot) => {
            manualBalances = snapshot.val() || {};
            renderBalances();
        });

        onValue(ref(db, 'biz_checkpoint_bal'), (snapshot) => {
            checkpointBalance = parseFloat(snapshot.val()) || 0;
            const chkInput = document.getElementById('manual-checkpoint-input');
            if (chkInput) chkInput.value = checkpointBalance || '';
            renderBalances();
        });

        // UI View Mode Adjuster Engine
        function setMode(mode) {
            currentMode = mode;
            const lbl02 = document.getElementById('lbl-02');
            const lbl03 = document.getElementById('lbl-03');
            const btnDep = document.getElementById('btn-dep');
            const btnWit = document.getElementById('btn-wit');
            const inputFrom = document.getElementById('entry-from');
            const inputTo1 = document.getElementById('entry-to-1');
            const inputTo2 = document.getElementById('entry-to-2');
            const inputTo3 = document.getElementById('entry-to-3');
            const rowBoxContainer = document.getElementById('row-box-container');

            if (mode === 'deposit') {
                btnDep.classList.add('active-deposit');
                btnWit.classList.remove('active-withdrawal');
                lbl02.innerText = '(02) Banks';
                lbl02.style.color = '#27ae60'; 
                lbl03.innerHTML = '<strong>(03) & (04) Betting Site සහ LKR මුදල</strong>';
                lbl03.style.color = '#c0392b'; 
                rowBoxContainer.style.borderLeftColor = '#e74c3c';
                inputFrom.placeholder = 'Type Bank Name...';
                inputTo1.placeholder = 'Betting Site 1';
                inputTo2.placeholder = 'Betting Site 2';
                inputTo3.placeholder = 'Betting Site 3';
            } else {
                btnWit.classList.add('active-withdrawal');
                btnDep.classList.remove('active-deposit');
                lbl02.innerText = '(02) Betting Site';
                lbl02.style.color = '#c0392b'; 
                lbl03.innerHTML = '<strong>(03) & (04) Banks සහ LKR මුදල</strong>';
                lbl03.style.color = '#27ae60'; 
                rowBoxContainer.style.borderLeftColor = '#2ecc71';
                inputFrom.placeholder = 'Type Betting Site...';
                inputTo1.placeholder = 'Bank 1';
                inputTo2.placeholder = 'Bank 2';
                inputTo3.placeholder = 'Bank 3';
            }
        }

        // Authentication Framework Routing Login Method
        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const allowedUsers = ["Dana", "Malith", "hasanka"];

            if (allowedUsers.includes(user) && pass === "123") {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'block';
                document.getElementById('welcome-text').innerText = `User: ${user} | System Dashboard`;
                document.getElementById('manual-checkpoint-input').value = checkpointBalance || '';
                renderDatabase();
                renderBalances();
            } else {
                document.getElementById('login-error').innerText = "Invalid Username or Password! Try again.";
            }
        }

        function logout() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('main-dashboard').style.display = 'none';
        }

        function switchView(viewId) {
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            if (viewId === 'database-view') { renderDatabase(); clearSearchFilter(); }
            if (viewId === 'balance-view') renderBalances();
        }

        // Structured Suggestion Matrix Generator Engine
        function showSuggestions(inputId, listId, fieldType) {
            const inputVal = document.getElementById(inputId).value.toLowerCase();
            const listEl = document.getElementById(listId);
            listEl.innerHTML = '';

            if (!inputVal) { listEl.style.display = 'none'; return; }

            let dataset = new Set(fixedAccounts);
            records.forEach(r => {
                if (fieldType === 'namePhone' && r.name) dataset.add(r.name);
                if (fieldType === 'fromAcc' && r.from) dataset.add(r.from);
                if (fieldType === 'toAcc') {
                    if (r.to1) dataset.add(r.to1);
                    if (r.to2) dataset.add(r.to2);
                    if (r.to3) dataset.add(r.to3);
                }
            });

            const filtered = Array.from(dataset).filter(item => item.toLowerCase().includes(inputVal));

            if (filtered.length > 0) {
                listEl.style.display = 'block';
                filtered.forEach(item => {
                    let li = document.createElement('li');
                    li.innerText = item;
                    li.onclick = function() {
                        document.getElementById(inputId).value = item;
                        listEl.style.display = 'none';
                        if (inputId === 'db-search-input') { filterDatabaseBySearch(); }
                    };
                    listEl.appendChild(li);
                });
            } else {
                listEl.style.display = 'none';
            }
        }

        document.addEventListener('click', function(e) {
            if (!e.target.matches('.autocomplete input')) {
                document.querySelectorAll('.suggestions-list').forEach(ul => ul.style.display = 'none');
            }
        });

        // Core Save Data Controller Endpoint - Connected to Firebase Cloud
        function saveData() {
            const name = document.getElementById('entry-name').value.trim();
            const from = document.getElementById('entry-from').value.trim();
            const to1 = document.getElementById('entry-to-1').value.trim();
            const lkr1 = parseFloat(document.getElementById('entry-lkr-1').value) || 0;
            const to2 = document.getElementById('entry-to-2').value.trim();
            const lkr2 = parseFloat(document.getElementById('entry-lkr-2').value) || 0;
            const to3 = document.getElementById('entry-to-3').value.trim();
            const lkr3 = parseFloat(document.getElementById('entry-lkr-3').value) || 0;
            const status = document.getElementById('entry-status').value;
            const note = document.getElementById('entry-note').value;

            if (!name || !from) {
                alert("Please fill in the Name and Account Source fields.");
                return;
            }

            let timestamp = editIndex !== null ? records[editIndex].timestamp : new Date().toLocaleString();
            
            const recordPayload = {
                timestamp,
                mode: currentMode,
                name,
                from,
                to1, lkr1,
                to2, lkr2,
                to3, lkr3,
                status,
                note
            };

            if (editIndex !== null) {
                records[editIndex] = recordPayload;
                editIndex = null;
            } else {
                records.push(recordPayload);
            }

            set(ref(db, 'biz_records'), records)
                .then(() => {
                    document.getElementById('entry-name').value = '';
                    document.getElementById('entry-from').value = '';
                    document.getElementById('entry-to-1').value = '';
                    document.getElementById('entry-lkr-1').value = '';
                    document.getElementById('entry-to-2').value = '';
                    document.getElementById('entry-lkr-2').value = '';
                    document.getElementById('entry-to-3').value = '';
                    document.getElementById('entry-lkr-3').value = '';
                    document.getElementById('entry-status').value = 'Yes';
                    document.getElementById('entry-note').value = '';
                    switchView('database-view');
                })
                .catch(err => alert("Transmission Error: " + err.message));
        }

        // Render Saved Ledger Records to Dom Database View Panel
        function renderDatabase() {
            const body = document.getElementById('database-body');
            if (!body) return;
            body.innerHTML = '';

            records.forEach((r, idx) => {
                const tr = document.createElement('tr');
                
                let statusClass = '';
                if (r.status === 'Yes') statusClass = 'status-yes';
                else if (r.status === 'Nayata') statusClass = 'status-nayata';
                else if (r.status === 'Pending Deposit') statusClass = 'status-p-deposit';
                else if (r.status === 'Pending Withdrawal') statusClass = 'status-p-withdrawal';

                const destinations = [r.to1, r.to2, r.to3].filter(Boolean).join(', ');
                const fundingBreakdown = [r.lkr1, r.lkr2, r.lkr3].filter(val => val > 0).map(val => val.toFixed(2)).join(' + ');
                const combinedGrossSum = (r.lkr1 || 0) + (r.lkr2 || 0) + (r.lkr3 || 0);

                tr.innerHTML = `
                    <td>${r.timestamp || ''}</td>
                    <td class="cursor-pointer" style="font-weight:bold; color:var(--primary);" onclick="selectPersonalLedger('${r.name ? r.name.replace(/'/g, "\\'") : ''}')">${r.name || ''}</td>
                    <td>${r.from || ''}</td>
                    <td>${destinations || 'N/A'}</td>
                    <td>${fundingBreakdown} (${combinedGrossSum.toFixed(2)})</td>
                    <td class="${statusClass}">${r.status || ''}</td>
                    <td>${r.note || ''}</td>
                    <td>
                        <button onclick="editRecord(${idx})" style="padding:5px 10px; background:#f39c12; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:600;">Edit</button>
                        <button onclick="deleteRecord(${idx})" style="padding:5px 10px; background:var(--danger); color:white; border:none; border-radius:4px; cursor:pointer; font-weight:600;">Delete</button>
                    </td>
                `;
                body.appendChild(tr);
            });
        }

        // Live Multipurpose System Filtering Engine (Modified to include Amounts Search)
        function filterDatabaseBySearch() {
            const searchVal = document.getElementById('db-search-input').value.toLowerCase().trim();
            const rows = document.querySelectorAll('#database-body tr');
            
            rows.forEach((row, idx) => {
                const r = records[idx];
                if (!r) return;
                const matchName = r.name && r.name.toLowerCase().includes(searchVal);
                const matchFrom = r.from && r.from.toLowerCase().includes(searchVal);
                const matchTo = `${r.to1} ${r.to2} ${r.to3}`.toLowerCase().includes(searchVal);
                // Added check to match individual LKR amounts
                const matchAmount = `${r.lkr1 || ''} ${r.lkr2 || ''} ${r.lkr3 || ''}`.includes(searchVal);

                if (searchVal === '' || matchName || matchFrom || matchTo || matchAmount) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });

            if (searchVal) {
                calculatePersonalLedger(searchVal);
            } else {
                document.getElementById('personal-ledger-box').style.display = 'none';
            }
        }

        function selectPersonalLedger(name) {
            document.getElementById('db-search-input').value = name;
            filterDatabaseBySearch();
        }

        function calculatePersonalLedger(filterText) {
            const ledgerBox = document.getElementById('personal-ledger-box');
            const titleEl = document.getElementById('ledger-title');
            const depList = document.getElementById('ledger-deposit-list');
            const witList = document.getElementById('ledger-withdrawal-list');
            const depTotalEl = document.getElementById('ledger-deposit-total');
            const witTotalEl = document.getElementById('ledger-withdrawal-total');
            const nayataSumEl = document.getElementById('ledger-nayata-sum');
            const pdepSumEl = document.getElementById('ledger-pdep-sum');
            const pwitSumEl = document.getElementById('ledger-pwit-sum');

            titleEl.innerText = `Personal Financial Summary: ${filterText.toUpperCase()}`;
            depList.innerHTML = '';
            witList.innerHTML = '';

            let totalDep = 0, totalWit = 0, totalNayata = 0, totalPDep = 0, totalPWit = 0;

            records.forEach(r => {
                if (r.name && r.name.toLowerCase().includes(filterText)) {
                    const gross = (r.lkr1 || 0) + (r.lkr2 || 0) + (r.lkr3 || 0);
                    
                    if (r.status === 'Nayata') totalNayata += gross;
                    if (r.status === 'Pending Deposit') totalPDep += gross;
                    if (r.status === 'Pending Withdrawal') totalPWit += gross;

                    const simplifiedDate = r.timestamp.split(',')[0];
                    const itemHtml = `<div>${simplifiedDate} - <strong>${gross.toFixed(2)} LKR</strong> (${r.from} ➔ ${[r.to1, r.to2, r.to3].filter(Boolean).join('/')})</div>`;
                    
                    if (r.mode === 'deposit') {
                        totalDep += gross;
                        depList.innerHTML += itemHtml;
                    } else if (r.mode === 'withdrawal') {
                        totalWit += gross;
                        witList.innerHTML += itemHtml;
                    }
                }
            });

            depTotalEl.innerText = totalDep.toFixed(2);
            witTotalEl.innerText = totalWit.toFixed(2);
            nayataSumEl.innerText = totalNayata.toFixed(2);
            pdepSumEl.innerText = totalPDep.toFixed(2);
            pwitSumEl.innerText = totalPWit.toFixed(2);

            ledgerBox.style.display = 'block';
        }

        function clearSearchFilter() {
            document.getElementById('db-search-input').value = '';
            filterDatabaseBySearch();
        }

        function editRecord(idx) {
            const r = records[idx];
            editIndex = idx;
            switchView('entry-view');
            
            setMode(r.mode);
            document.getElementById('entry-name').value = r.name || '';
            document.getElementById('entry-from').value = r.from || '';
            document.getElementById('entry-to-1').value = r.to1 || '';
            document.getElementById('entry-lkr-1').value = r.lkr1 || '';
            document.getElementById('entry-to-2').value = r.to2 || '';
            document.getElementById('entry-lkr-2').value = r.lkr2 || '';
            document.getElementById('entry-to-3').value = r.to3 || '';
            document.getElementById('entry-lkr-3').value = r.lkr3 || '';
            document.getElementById('entry-status').value = r.status || 'Yes';
            document.getElementById('entry-note').value = r.note || '';
        }

        function deleteRecord(idx) {
            if (confirm("Are you sure you want to delete this systemic entry permanent?")) {
                records.splice(idx, 1);
                set(ref(db, 'biz_records'), records);
            }
        }

        // Mathematical Ledger Formulating Balance Allocation Matrix Engine
        function renderBalances() {
            let balances = {};
            fixedAccounts.forEach(acc => {
                balances[acc] = parseFloat(manualBalances[acc]) || 0;
            });

            let totalNayata = 0;
            let totalPendingDeposit = 0;
            let totalPendingWithdrawal = 0;

            records.forEach(r => {
                const amt1 = parseFloat(r.lkr1) || 0;
                const amt2 = parseFloat(r.lkr2) || 0;
                const amt3 = parseFloat(r.lkr3) || 0;
                const grossTotal = amt1 + amt2 + amt3;

                if (r.status === 'Nayata') totalNayata += grossTotal;
                if (r.status === 'Pending Deposit') totalPendingDeposit += grossTotal;
                if (r.status === 'Pending Withdrawal') totalPendingWithdrawal += grossTotal;

                const src = (r.from || '').toLowerCase();
                if (balances[src] !== undefined) {
                    balances[src] -= grossTotal;
                }
                
                const t1 = (r.to1 || '').toLowerCase(); if (balances[t1] !== undefined) balances[t1] += amt1;
                const t2 = (r.to2 || '').toLowerCase(); if (balances[t2] !== undefined) balances[t2] += amt2;
                const t3 = (r.to3 || '').toLowerCase(); if (balances[t3] !== undefined) balances[t3] += amt3;
            });

            const grid = document.getElementById('account-balances-grid');
            if (!grid) return;
            grid.innerHTML = '';

            let banksTotal = 0;
            let bettingTotal = 0;
            let accountsTotal = 0;

            fixedAccounts.forEach(acc => {
                if (acc === 'mulu naya') return;

                const balanceVal = balances[acc] || 0;
                const configurationBase = manualBalances[acc] || 0;

                if (bankAccounts.includes(acc)) banksTotal += balanceVal;
                if (bettingAccounts.includes(acc)) bettingTotal += balanceVal;
                accountsTotal += balanceVal;

                const card = document.createElement('div');
                card.className = 'balance-card';
                // Modified card innerHTML to make title and balance clickable for specific account drill-down view
                card.innerHTML = `
                    <div onclick="openAccountDetails('${acc.replace(/'/g, "\\'")}')" style="cursor:pointer;" title="Click to view details">
                        <h5 style="margin:0 0 8px 0; text-transform:uppercase; color:var(--secondary); font-size:12px;">${acc} 🔍</h5>
                        <h3 style="margin:0 0 10px 0; color:var(--primary); font-size:20px;">${balanceVal.toFixed(2)} LKR</h3>
                    </div>
                    <label style="font-size:11px; color:#7f8c8d; display:block;">Base Adjustment Base:</label>
                    <input type="number" value="${configurationBase || ''}" placeholder="0.00" onchange="updateManualBalance('${acc}', this.value)" style="width:100%; padding:5px; font-size:12px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; margin-top:2px;">
                `;
                grid.appendChild(card);
            });

            const combinedMuluNaya = totalNayata + (parseFloat(manualBalances['mulu naya']) || 0);
            const actualNetBalance = (accountsTotal + combinedMuluNaya) - totalPendingDeposit - totalPendingWithdrawal;

            document.getElementById('total-nayata').innerText = `${combinedMuluNaya.toFixed(2)} LKR`;
            document.getElementById('manual-naya').value = manualBalances['mulu naya'] || '';
            document.getElementById('total-p-deposit').innerText = `${totalPendingDeposit.toFixed(2)} LKR`;
            document.getElementById('total-p-withdrawal').innerText = `${totalPendingWithdrawal.toFixed(2)} LKR`;
            document.getElementById('actual-net-balance').innerText = `${actualNetBalance.toFixed(2)} LKR`;
            document.getElementById('group-banks-total').innerText = `${banksTotal.toFixed(2)} LKR`;
            document.getElementById('group-betting-total').innerText = `${bettingTotal.toFixed(2)} LKR`;

            const variancePanel = document.getElementById('navbar-variance-panel');
            if (variancePanel) {
                const variance = actualNetBalance - checkpointBalance;
                if (Math.abs(variance) < 0.01) {
                    variancePanel.innerHTML = `<span style="color: #2ecc71; font-size:15px;">✓ System Balanced (Variance: 0.00 LKR)</span>`;
                } else if (variance > 0) {
                    variancePanel.innerHTML = `<span style="color: #f1c40f; font-size:15px;">▲ Surplus Discrepancy: +${variance.toFixed(2)} LKR</span>`;
                } else {
                    variancePanel.innerHTML = `<span style="color: #e74c3c; font-size:15px;">▼ Shortage Discrepancy: ${variance.toFixed(2)} LKR</span>`;
                }
            }
        }

        function saveManualCheckpoint() {
            const val = parseFloat(document.getElementById('manual-checkpoint-input').value) || 0;
            set(ref(db, 'biz_checkpoint_bal'), val)
                .then(() => alert("System Target Checkpoint Balance Synchronized!"))
                .catch(err => alert("Error: " + err.message));
        }

        function updateManualBalance(accountName, value) {
            manualBalances[accountName] = parseFloat(value) || 0;
            set(ref(db, 'biz_manual_bal'), manualBalances);
        }

        // Modal Action Configurations Engine
        function openDetails(statusType) {
            currentOpenStatusType = statusType;
            const modal = document.getElementById('details-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            title.innerText = `${statusType} Active Records`;
            body.innerHTML = '';
            modal.style.display = 'flex';

            records.forEach((r, idx) => {
                if (r.status === statusType) {
                    const gross = (r.lkr1 || 0) + (r.lkr2 || 0) + (r.lkr3 || 0);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${r.timestamp || ''}</td>
                        <td><strong>${r.name || 'N/A'}</strong></td>
                        <td>${gross.toFixed(2)} LKR</td>
                        <td>
                            <button onclick="resolveStatus(${idx})" style="padding:5px 12px; background:var(--success); color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Mark Complete (Yes)</button>
                        </td>
                    `;
                    body.appendChild(tr);
                }
            });
        }

        // Added Function: Opens details modal tailored dynamically for accounts / manual items
        function openAccountDetails(accName) {
            currentOpenStatusType = { type: 'account', name: accName };
            const modal = document.getElementById('details-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            title.innerText = `${accName.toUpperCase()} Transaction Ledger Details`;
            body.innerHTML = '';
            modal.style.display = 'flex';

            records.forEach((r, idx) => {
                const isSrc = (r.from || '').toLowerCase() === accName.toLowerCase();
                const isT1 = (r.to1 || '').toLowerCase() === accName.toLowerCase();
                const isT2 = (r.to2 || '').toLowerCase() === accName.toLowerCase();
                const isT3 = (r.to3 || '').toLowerCase() === accName.toLowerCase();

                if (isSrc || isT1 || isT2 || isT3) {
                    let amtText = '';
                    if (isSrc) {
                        amtText += `-${((r.lkr1 || 0) + (r.lkr2 || 0) + (r.lkr3 || 0)).toFixed(2)}`;
                    } else {
                        let pieces = [];
                        if (isT1) pieces.push(`+${(r.lkr1 || 0).toFixed(2)}`);
                        if (isT2) pieces.push(`+${(r.lkr2 || 0).toFixed(2)}`);
                        if (isT3) pieces.push(`+${(r.lkr3 || 0).toFixed(2)}`);
                        amtText += pieces.join(' / ');
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${r.timestamp || ''}</td>
                        <td><strong>${r.name || 'N/A'}</strong> (${r.status})</td>
                        <td>${amtText} LKR</td>
                        <td>
                            <button onclick="editRecord(${idx}); closeModal();" style="padding:5px 12px; background:#f39c12; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Edit</button>
                        </td>
                    `;
                    body.appendChild(tr);
                }
            });
        }

        function resolveStatus(idx) {
            records[idx].status = 'Yes';
            set(ref(db, 'biz_records'), records).then(() => {
                if (currentOpenStatusType) {
                    if (typeof currentOpenStatusType === 'string') {
                        openDetails(currentOpenStatusType);
                    } else if (currentOpenStatusType.type === 'account') {
                        openAccountDetails(currentOpenStatusType.name);
                    }
                } else {
                    closeModal();
                }
            });
        }

        function closeModal() {
            document.getElementById('details-modal').style.display = 'none';
            currentOpenStatusType = null;
        }

        // Explicit Global Scope Window Routing Registrations
        window.login = login;
        window.logout = logout;
        window.switchView = switchView;
        window.setMode = setMode;
        window.showSuggestions = showSuggestions;
        window.saveData = saveData;
        window.filterDatabaseBySearch = filterDatabaseBySearch;
        window.clearSearchFilter = clearSearchFilter;
        window.saveManualCheckpoint = saveManualCheckpoint;
        window.updateManualBalance = updateManualBalance;
        window.openDetails = openDetails;
        window.openAccountDetails = openAccountDetails; // Added window registration
        window.closeModal = closeModal;
        window.editRecord = editRecord;
        window.deleteRecord = deleteRecord;
        window.selectPersonalLedger = selectPersonalLedger;
        window.resolveStatus = resolveStatus;
    </script>
</body>
</html>
